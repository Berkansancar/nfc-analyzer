name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CI: "1"
      EXPO_NO_TELEMETRY: "1"
    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Node.js kur
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: NPM paketlerini kur
        run: npm install --no-audit --no-fund

      - name: Android proje dosyalarini olustur (expo prebuild)
        run: npx expo prebuild --platform android --no-install

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: APK dosyasini hazirla
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/*.apk dist/NFC-Analyzer.apk
          ls -lh dist

      - name: APK'yi Actions ciktisi olarak yukle
        uses: actions/upload-artifact@v4
        with:
          name: NFC-Analyzer-apk
          path: dist/NFC-Analyzer.apk

      - name: APK'yi Releases sayfasina koy (telefondan dogrudan indirmek icin)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: NFC Analyzer APK #${{ github.run_number }}
          files: dist/NFC-Analyzer.apk
